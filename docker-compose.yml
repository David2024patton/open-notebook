services:
  surrealdb:
    image: surrealdb/surrealdb:v2
    # Credentials default to root:root for a zero-config local setup. Before
    # exposing this instance to a network, set SURREAL_USER / SURREAL_PASSWORD
    # in a .env file (see .env.example) — they are applied here and to the
    # open_notebook service below, so the two always stay in sync.
    # List (exec) form so each interpolated value stays a single argument —
    # a password containing spaces would otherwise be split into several.
    command: ["start", "--log", "info", "--user", "${SURREAL_USER:-root}", "--pass", "${SURREAL_PASSWORD:-root}", "rocksdb:/mydata/clean.db"]
    # DIAGNOSTIC (temporary): pointed at a fresh rocksdb file (clean.db) to
    # bypass a corrupted mydatabase.db left by earlier broken migration 23
    # runs. All data is reset; migrations 1-23 re-run from scratch.
    user: root  # Required for bind mounts on Linux
    # Bind to loopback only: the app connects over the internal Docker network
    # (ws://surrealdb:8000); the DB must never be reachable on the public VPS.
    # The host port is purely for local debugging (e.g. Surrealist, `surreal
    # sql`). Exposing on 0.0.0.0 would let anyone who can reach the host
    # connect with the default root:root credentials.
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./surreal_data:/mydata
    environment:
      - SURREAL_EXPERIMENTAL_GRAPHQL=true
    restart: always
    pull_policy: always

  open_notebook:
    build: .
    image: open-notebook:latest
    # All ports bound to 127.0.0.1 so nothing is public on the VPS. Only the
    # Dokploy-managed Traefik reverse proxy reaches the container (by name on
    # the shared Docker network) and exposes it at brain.itak.live with auto
    # Let's Encrypt TLS. Locally, 127.0.0.1:8502 still works exactly as before.
    ports:
      - "127.0.0.1:8502:8502"  # Web UI (loopback only — Traefik fronts it)
      # NOTE: 5055 (REST API) is intentionally NOT published. It is reached
      # internally by the frontend. Do not expose it directly to the internet.
      - "127.0.0.1:2222:2222"  # SSH (loopback only; not public)
    environment:
      # REQUIRED secrets — set these in a .env file before deploying. The
      # ${VAR:?...} syntax makes Compose fail fast with a clear message if a
      # secret is missing, so no container ever runs with an insecure default.
      - OPEN_NOTEBOOK_ENCRYPTION_KEY=${OPEN_NOTEBOOK_ENCRYPTION_KEY:?set OPEN_NOTEBOOK_ENCRYPTION_KEY in .env}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?set JWT_SECRET_KEY in .env}

      # Multi-user mode configuration
      - OPEN_NOTEBOOK_AUTH_MODE=multi-user
      - JWT_EXPIRATION_HOURS=${JWT_EXPIRATION_HOURS:-24}

      # DIAGNOSTIC (temporary): skip startup migrations so a broken migration 23
      # can't crash the worker; re-enable once the worker is confirmed up.
      - OPEN_NOTEBOOK_SKIP_MIGRATIONS=1

      # SSH access (optional). Override SSH_PASSWORD in .env for production.
      - SSH_USER=${SSH_USER:-notebook}
      - SSH_PASSWORD=${SSH_PASSWORD:-notebook}
      - SSH_PORT=2222

      # Ollama endpoint. On a local desktop use host.docker.internal; on a
      # Linux VPS point this at the host's LAN/VPN IP instead (see Phase 2).
      - OLLAMA_API_BASE=${OLLAMA_API_BASE:-http://host.docker.internal:11434}

      # Database connection. SURREAL_USER / SURREAL_PASSWORD default to root:root
      # for local use; override them in a .env file before exposing the instance
      # (the same values configure the surrealdb service above).
      - SURREAL_URL=ws://surrealdb:8000/rpc

      # Public API URL the browser uses for /api/* requests. Set to the
      # Traefik-facing domain so the browser talks same-origin (Traefik ->
      # frontend :8502 -> Next.js rewrite proxy -> backend :5055 internal).
      # Without this, the /config route auto-detects :5055 which is NOT
      # published, producing "Unable to Connect to API Server".
      - API_URL=${API_URL:-https://brain.itak.live}
      - SURREAL_USER=${SURREAL_USER:-root}
      - SURREAL_PASSWORD=${SURREAL_PASSWORD:-root}
      - SURREAL_NAMESPACE=open_notebook
      - SURREAL_DATABASE=open_notebook

      # OPTIONAL: heavy extraction runtimes, installed on first startup when
      # enabled (downloads are cached on the ./notebook_data volume, so only the
      # first boot is slow). See docs/5-CONFIGURATION/environment-reference.md.
      # - OPEN_NOTEBOOK_ENABLE_DOCLING=true    # Docling engine + OCR + image sources (large ML stack)
      # - OPEN_NOTEBOOK_ENABLE_CRAWL4AI=true   # local Crawl4AI (bundles a Chromium browser)
      # - CRAWL4AI_API_URL=http://crawl4ai:11235  # use a remote Crawl4AI server instead (no local install)

      # OPTIONAL: max concurrent background tasks the worker processes at once
      # (default 5). Set to 1 for sequential processing on single-GPU / local
      # LLM setups to avoid overloading the model with parallel requests.
      # - OPEN_NOTEBOOK_WORKER_MAX_TASKS=1
    # NOTE: no /app/data bind mount. The host bind source got into a read-only /
    # missing state that made /app/data unwritable and crashed the api at
    # startup (mkdir /app/data/.cache failed). Instead we mount a tmpfs at
    # /app/data: a writable in-memory directory (no host mount, no read-only
    # issue). Caches (UV_CACHE_DIR etc.) are redirected to /tmp by supervisord.
    # The tmpfs also forces Docker Compose to recreate the container on deploy.
    tmpfs:
      - /app/data
    depends_on:
      - surrealdb
    restart: always
